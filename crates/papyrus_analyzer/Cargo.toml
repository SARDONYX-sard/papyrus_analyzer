[package]
name                   = "papyrus_analyzer"
version                = "0.5.0"
authors.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Language server for the Papyrus scripting language."
license.workspace      = true

[[bin]]
name = "papyrus_analyzer"
path = "src/main.rs"

[features]
default = ["mimalloc"]
# The global allocator. Compiling and running tests on all cores allocate a
# lot from every thread, which the allocator of the system serializes. With
# both features, jemalloc is used; it is not available with MSVC (Windows),
# where the feature does nothing.
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
papyrus_compiler.workspace   = true
papyrus_decompiler.workspace = true
papyrus_fmt.workspace        = true
papyrus_ide.workspace        = true
papyrus_lint.workspace       = true
papyrus_parser.workspace     = true
papyrus_pex.workspace        = true
papyrus_project.workspace    = true
papyrus_vm.workspace         = true

anyhow.workspace            = true
crossbeam-channel.workspace = true
lsp-server                  = "0.10.0"
lsp-types                   = "0.97"
log                         = "0.4"
mimalloc                    = { workspace = true, optional = true }
rayon.workspace             = true
rustc-hash.workspace        = true
env_logger                  = "0.11"
serde                       = { version = "1", features = ["derive"] }
serde_json.workspace        = true

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[lints]
workspace = true
