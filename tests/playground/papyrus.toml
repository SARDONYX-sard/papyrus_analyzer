# "$schema" = "https://raw.githubusercontent.com/SARDONYX-sard/papyrus_analyzer/refs/tags/0.2.1/schemas/papyrus.schema.json"
"$schema" = "../../schemas/papyrus.schema.json"

[package]
name    = "MyMod"
version = "0.1.0"

[compiler]
args.workspace = true

[build]
sources            = ["src"]
output             = "${workspaceFolder}/target/papyrus"
imports.workspace  = true
flags.workspace    = true
optimize.workspace = true
release.workspace  = true
final.workspace    = true
quiet.workspace    = true

[test]
sources = ["tests"]

[lints]
workspace = true

[format]
workspace = true
