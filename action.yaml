name: setup-papyrus_analyzer
description: >-
  Install papyrus_analyzer, the language server, compiler, linter and
  formatter of Papyrus scripts, on the PATH: the executable of a release,
  downloaded, so no Rust toolchain or build is needed.
author: SARDONYX
branding:
  icon: download
  color: green

inputs:
  version:
    description: >-
      The release to install: a tag such as `0.6.0`, or `latest`. Empty (the
      default) means the tag the action is used at (`@0.6.0`), or `latest`
      when it is used at a branch or a commit. Releases before 0.6.0 have no
      executable alone and cannot be installed.
    required: false
    default: ""

outputs:
  path:
    description: The path of the installed executable.
    value: ${{ steps.install.outputs.path }}
  version:
    description: The release installed.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install papyrus_analyzer
      id: install
      shell: bash
      env:
        REPOSITORY: SARDONYX-sard/papyrus_analyzer
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail

        # The targets of the releases (.github/workflows/build.yaml).
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-gnu ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          Windows-X64) target=x86_64-pc-windows-msvc ;;
          *)
            echo "::error::papyrus_analyzer has no release for $RUNNER_OS $RUNNER_ARCH"
            exit 1
            ;;
        esac
        exe=""
        if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi

        # The version: the input, else the tag of the action, else the latest.
        version="$INPUT_VERSION"
        if [ -z "$version" ]; then
          if [[ "$ACTION_REF" =~ ^v?[0-9]+\.[0-9]+ ]]; then
            version="$ACTION_REF"
          else
            version=latest
          fi
        fi

        asset="papyrus_analyzer-$target$exe"
        if [ "$version" = latest ]; then
          url="https://github.com/$REPOSITORY/releases/latest/download/$asset"
        else
          url="https://github.com/$REPOSITORY/releases/download/$version/$asset"
        fi

        dir="$RUNNER_TEMP/papyrus_analyzer/$version"
        mkdir -p "$dir"
        path="$dir/papyrus_analyzer$exe"
        echo "Downloading $url"
        if ! curl --fail --silent --show-error --location --retry 3 --output "$path" "$url"; then
          echo "::error::cannot download $asset of the release $version of $REPOSITORY"
          exit 1
        fi
        chmod +x "$path"

        echo "$dir" >> "$GITHUB_PATH"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        "$path" --version
